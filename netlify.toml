# Vaultique Boutique Point — website (separate Netlify site, own setup)
# This config does NOT touch the POS site or its Supabase project.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # robots.js, sitemap.js and send-email.js read this website's Supabase
  # address and public key out of config.js, so that they live in one
  # place rather than being copied into the Netlify environment as well,
  # where the two could drift apart.
  #
  # esbuild bundles the function, not the publish directory, so without
  # this line the deployed function has no config.js to read and all
  # three fail quietly: robots.txt drops to two hardcoded lines, the
  # sitemap loses the catalogue and the policies, and every attempt to
  # send email is refused as though the sender were not an administrator.
  #
  # assets/formats.js is included for the payment functions (pay-*.js):
  # they work out what to charge with the very same price rules the page
  # uses to show a price, so the two can never disagree.
  included_files = ["config.js", "assets/formats.js"]

# ---------------------------------------------------------------------
# The product pulse.
#
# It reads ONE COLUMN of ONE ROW from the business platform — a timestamp
# — and writes a signal into this website's own Supabase only when that
# timestamp has moved. Open browsers hear the signal through Realtime and
# fetch the catalogue then, and only then. Nothing anywhere polls the
# catalogue itself.
#
# FIVE MINUTES, not one, and the reason is cost: a scheduled function is
# one invocation per run whether or not anything changed. Every minute is
# about 43,000 a month; this is about 8,600. Widen it to spend less — the
# storefront's own fallback refresh catches anything missed either way,
# so the only thing at stake here is how quickly a change reaches a
# browser that is already open.
[functions."product-pulse"]
  schedule = "*/5 * * * *"

# Once a day, a few minutes past three in the morning UTC. Nothing called
# site_prune() before this round -- it existed, was granted, was
# documented, and site_events grew for ever. Thirty invocations a month,
# and the day summaries it reads from are never touched.
[functions."site-prune"]
  schedule = "7 3 * * *"

# Pretty path so the storefront calls /api/products
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

# ---------------------------------------------------------------------
# Real addresses for the storefront.
#
# The site draws every page itself, so /shop and /policies are not files
# on disk. Without these rules a visitor typing one, or a search engine
# following a link to one, would get a 404.
#
# The passthrough rules come FIRST and on purpose. Netlify serves an
# existing file before applying a redirect, so the catch-all below would
# not swallow the admin or the assets anyway — but relying on that is
# relying on a default. Saying it plainly costs four lines and cannot be
# got wrong by a later change.
[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

# The service worker and the home-screen details.
#
# These two are named explicitly for the same reason as the three above:
# the catch-all at the bottom of this file would otherwise be the only
# thing standing between them and a page of HTML. A service worker served
# as HTML does not fail loudly — the browser refuses to register it and
# says so only in a console nobody has open, and the shop simply never
# gets a notification again.
#
# The worker must answer at the site root and nowhere else. Its authority
# reaches only the folder it came from, so one served from /assets/ could
# not watch over /admin.html.
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

# Built when it is asked for, so the installed app's icon is whichever
# logo the shop last uploaded in Settings > Branding rather than the file
# the folder was built with. force = true because the static
# manifest.webmanifest is still in the folder as the fallback, and
# Netlify serves a file that exists before it reaches a redirect.
[[redirects]]
  from = "/manifest.webmanifest"
  to = "/.netlify/functions/manifest"
  status = 200
  force = true

# The picture on a shared link. og:image in index.html names this fixed
# address and this sends whoever asks on to whatever the shop last
# uploaded, because the things that build a link preview -- WhatsApp,
# Facebook, Twitter -- do not run the JavaScript that would otherwise
# put the tag right. Nothing on the page loads this, so a customer never
# touches it: it is called when a link is shared and at no other time.
[[redirects]]
  from = "/social-image"
  to = "/.netlify/functions/social-image"
  status = 200

# ---------------------------------------------------------------------
# Files that ship with the site but are nobody's business but the shop's.
#
# The publish directory is the whole folder, so the setup files and the
# instructions sit at the site root and answer to anyone who asks for
# them by name. There is nothing secret in them — no keys, no passwords —
# but they are the full table layout and every access rule the database
# has, handed over for the asking, and there is no reason to hand it over.
#
# force = true is the whole point of these rules: without it Netlify
# serves a file that exists and never reaches the redirect. Each one is
# named rather than matched by a pattern, because Netlify's "*" is a
# trailing splat and does not mean "any name ending in .sql" — a rule
# written that way would look right and do nothing.
#
# Anyone who needs these has the folder they uploaded, and the repository.
[[redirects]]
  from = "/supabase-setup.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-fixes.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
