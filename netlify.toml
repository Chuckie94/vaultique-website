# The checks that prove the product feed and the live update work. They
# ship with the folder so they can be re-run against any future change,
# and like the setup files above there is no reason to serve them.
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/LAUNCH.md"
  to = "/index.html"
  status = 404
  force = true

# The notes that ship inside the delivered folder telling the shop how to
# upload it. They are not part of the site and there is no reason to serve
# them, but they sit at the root like everything else, so they are named
# here in case they are uploaded along with the rest -- which is the
# simplest thing for the shop to do and should not cost anything.
[[redirects]]
  from = "/START-HERE.txt"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/HOW-TO-UPLOAD.txt"
  to = "/index.html"
  status = 404
  force = true

# The working notes from the build-342 defect round, and the script that
# was written to diagnose it. Same reasoning as the three above: nothing
# secret, but they are an inventory of what was wrong with the shop and
# what was decided about it, published at a guessable address to anyone
# who asks. They were missed when the rules above were written, which is
# the only reason they were ever served.
[[redirects]]
  from = "/DEFECT-FIX-PLAN-342.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEFECTS-342-ADDENDUM.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/PHASE-0-DECISIONS-342.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true

# Not secret either, and not interesting — but it is a file the folder
# carries rather than a page the shop serves, and the rule is cheap.
[[redirects]]
  from = "/.gitignore"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

# Crawlers only. Both are generated from Settings > SEO rather than kept
# as files, so they follow the settings without anything to re-upload.
[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Everything else is a page the storefront draws.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------
# The service worker must never be cached.
#
# A browser checks for a new worker on its own schedule, and if a stale
# copy is still inside the cache it may go on running for a day after a
# new folder is uploaded. The file is two kilobytes and is fetched once
# per visit; there is nothing to save by holding on to it, and a shop
# running last week's notification code has no way of knowing it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------------
# THE SCRIPTS, THE STYLESHEET AND THE PICTURES
#
# There was no rule for these at all, so Netlify's default made every
# visitor ask again about every file on every page they opened. Not a
# download each time -- the answer is usually "still the same" -- but a
# question each time, and on a phone on a slow connection the questions
# are most of the wait.
#
# AN HOUR, NOT A YEAR, AND THE REASON MATTERS. The usual advice is to
# cache these for a year and put the build number in the address --
# /assets/app.js?b=33 -- so a new build is a new address. That needs
# something to write the build number into forty script tags at package
# time, and this folder has no such step: it is uploaded as it stands.
# A number nobody updates is worse than no number, which is exactly what
# happened to assets/version.js.
#
# So: an hour. A customer reading five pages asks once instead of five
# times, and a deploy reaches everybody within the hour without anybody
# having to remember anything. stale-while-revalidate lets the next day's
# first visit paint from the stored copy while the new one is fetched
# behind it.
#
# THE PAGES THEMSELVES ARE NOT CACHED, deliberately, and are not listed
# here. index.html and admin.html keep Netlify's revalidate-every-time
# default so a deploy is visible immediately -- and because index.html is
# where the shop's own logo is now filled in, a stale one would be the
# very thing this build set out to stop.
# ---------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Pictures change far less often than code, and a product photo that is a
# day old is a day-old photo of the same piece.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
